<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cloroplasto Interactivo 3D — Guía de Biología</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#0a0f1a;color:#e0e0e0;overflow:hidden;height:100vh;width:100vw}
#canvas-container{position:absolute;top:0;left:0;width:100%;height:100%}
canvas{display:block}

/* Top bar */
#top-bar{position:fixed;top:0;left:0;right:0;height:48px;background:rgba(10,15,26,.92);backdrop-filter:blur(8px);display:flex;align-items:center;padding:0 16px;z-index:100;border-bottom:1px solid rgba(255,255,255,.08)}
#top-bar h1{font-size:15px;font-weight:600;color:#8fc98a;letter-spacing:.3px}
#top-bar .subtitle{font-size:11px;color:#7a8a9a;margin-left:12px}

/* Controls panel */
#controls{position:fixed;top:60px;left:12px;width:220px;max-height:calc(100vh - 80px);overflow-y:auto;background:rgba(14,20,32,.93);backdrop-filter:blur(10px);border-radius:10px;border:1px solid rgba(255,255,255,.07);padding:10px;z-index:90;scrollbar-width:thin;scrollbar-color:#2a3a4a transparent}
#controls::-webkit-scrollbar{width:4px}
#controls::-webkit-scrollbar-thumb{background:#2a3a4a;border-radius:2px}
.ctrl-section{margin-bottom:10px}
.ctrl-section h3{font-size:11px;text-transform:uppercase;color:#5a7a6a;margin-bottom:6px;letter-spacing:.8px}
.btn{display:block;width:100%;padding:7px 10px;margin-bottom:4px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);border-radius:6px;color:#c0d0c0;font-size:12px;cursor:pointer;transition:all .2s;text-align:left}
.btn:hover{background:rgba(143,201,138,.15);border-color:rgba(143,201,138,.3)}
.btn.active{background:rgba(143,201,138,.2);border-color:#8fc98a;color:#8fc98a}
.btn-icon{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle}
.btn-anim{background:rgba(100,160,255,.08);border-color:rgba(100,160,255,.15);color:#90b8f0}
.btn-anim:hover{background:rgba(100,160,255,.2)}
.btn-anim.active{background:rgba(100,160,255,.25);border-color:#6090d0;color:#a0c8ff}

/* Info panel */
#info-panel{position:fixed;top:60px;right:12px;width:280px;max-height:calc(100vh - 80px);overflow-y:auto;background:rgba(14,20,32,.95);backdrop-filter:blur(10px);border-radius:10px;border:1px solid rgba(255,255,255,.07);padding:16px;z-index:90;display:none;scrollbar-width:thin}
#info-panel.visible{display:block}
#info-panel h2{font-size:16px;color:#8fc98a;margin-bottom:8px}
#info-panel .info-func{font-size:13px;line-height:1.5;color:#b0c0b0}
#info-panel .info-tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px;margin-top:8px;background:rgba(143,201,138,.15);color:#8fc98a}
#close-info{position:absolute;top:8px;right:10px;background:none;border:none;color:#7a8a9a;cursor:pointer;font-size:16px}

/* Quiz overlay */
#quiz-overlay{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:rgba(14,20,32,.95);border:1px solid rgba(255,200,50,.3);border-radius:10px;padding:12px 24px;z-index:95;display:none;text-align:center}
#quiz-overlay.visible{display:block}
#quiz-question{font-size:14px;color:#f0d060}
#quiz-answer{margin-top:6px}
#quiz-answer input{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:4px;padding:4px 8px;color:#e0e0e0;font-size:13px}
#quiz-answer button{margin-left:6px;padding:4px 12px;background:#8fc98a;border:none;border-radius:4px;color:#0a0f1a;cursor:pointer;font-size:12px;font-weight:600}
#quiz-feedback{font-size:12px;margin-top:4px;min-height:16px}

/* Loading */
#loading{position:fixed;top:0;left:0;width:100%;height:100%;background:#0a0f1a;display:flex;align-items:center;justify-content:center;z-index:200;flex-direction:column}
#loading .spinner{width:40px;height:40px;border:3px solid rgba(143,201,138,.2);border-top-color:#8fc98a;border-radius:50%;animation:spin 1s linear infinite}
#loading p{margin-top:12px;color:#5a7a6a;font-size:13px}
@keyframes spin{to{transform:rotate(360deg)}}

/* Responsive */
@media(max-width:768px){
  #controls{width:180px;left:8px;top:54px;padding:8px}
  #info-panel{width:220px;right:8px;top:54px}
  .btn{font-size:11px;padding:6px 8px}
  #top-bar h1{font-size:13px}
}
@media(max-width:480px){
  #controls{width:160px;font-size:10px}
  #info-panel{width:calc(100vw - 24px);right:12px}
}
</style>
</head>
<body>

<div id="loading"><div class="spinner"></div><p>Cargando modelo 3D del cloroplasto…</p></div>

<div id="top-bar">
  <h1>🌿 Cloroplasto Interactivo 3D</h1>
  <span class="subtitle">Biología — Fotosíntesis y Organelos Celulares (MINEDUC)</span>
</div>

<div id="canvas-container"></div>

<div id="controls">
  <div class="ctrl-section">
    <h3>Vista</h3>
    <button class="btn" id="btn-autorotate" onclick="toggleAutoRotate()">⟳ Auto-rotación: ON</button>
    <button class="btn" id="btn-crosssection" onclick="toggleCrossSection()">✂ Corte transversal</button>
    <button class="btn" id="btn-labels" onclick="toggleLabels()">🏷 Etiquetas: OFF</button>
    <button class="btn" id="btn-reset" onclick="resetView()">↺ Reiniciar vista</button>
  </div>

  <div class="ctrl-section">
    <h3>Estructuras</h3>
    <button class="btn" data-structure="outerMembrane" onclick="toggleStructure(this)"><span class="btn-icon" style="background:#4a8a4a"></span>Membrana externa</button>
    <button class="btn" data-structure="innerMembrane" onclick="toggleStructure(this)"><span class="btn-icon" style="background:#3a7a3a"></span>Membrana interna</button>
    <button class="btn" data-structure="intermembrane" onclick="toggleStructure(this)"><span class="btn-icon" style="background:#5aaa6a"></span>Espacio intermembrana</button>
    <button class="btn" data-structure="stroma" onclick="toggleStructure(this)"><span class="btn-icon" style="background:#2a5a3a"></span>Estroma</button>
    <button class="btn" data-structure="thylakoids" onclick="toggleStructure(this)"><span class="btn-icon" style="background:#3a9a5a"></span>Tilacoides / Grana</button>
    <button class="btn" data-structure="lumen" onclick="toggleStructure(this)"><span class="btn-icon" style="background:#60c080"></span>Lumen tilacoidal</button>
    <button class="btn" data-structure="lamellae" onclick="toggleStructure(this)"><span class="btn-icon" style="background:#50b070"></span>Lamelas del estroma</button>
    <button class="btn" data-structure="dna" onclick="toggleStructure(this)"><span class="btn-icon" style="background:#f06060"></span>ADN circular</button>
    <button class="btn" data-structure="ribosomes" onclick="toggleStructure(this)"><span class="btn-icon" style="background:#d0a040"></span>Ribosomas 70S</button>
    <button class="btn" data-structure="plastoglobuli" onclick="toggleStructure(this)"><span class="btn-icon" style="background:#e0c040"></span>Plastoglóbulos</button>
    <button class="btn" data-structure="starchGranules" onclick="toggleStructure(this)"><span class="btn-icon" style="background:#e0e0c0"></span>Gránulos de almidón</button>
  </div>

  <div class="ctrl-section">
    <h3>Animaciones</h3>
    <button class="btn btn-anim" id="btn-lightphase" onclick="toggleLightPhase()">☀ Fase luminosa</button>
    <button class="btn btn-anim" id="btn-calvin" onclick="toggleCalvin()">🔄 Ciclo de Calvin</button>
  </div>

  <div class="ctrl-section">
    <h3>Evaluación</h3>
    <button class="btn" onclick="startQuiz()">❓ Quiz rápido</button>
  </div>
</div>

<div id="info-panel">
  <button id="close-info" onclick="closeInfo()">✕</button>
  <h2 id="info-title"></h2>
  <div class="info-func" id="info-body"></div>
  <span class="info-tag" id="info-tag"></span>
</div>

<div id="quiz-overlay">
  <div id="quiz-question"></div>
  <div id="quiz-answer">
    <input type="text" id="quiz-input" placeholder="Escribe el nombre…" onkeydown="if(event.key==='Enter')checkQuiz()">
    <button onclick="checkQuiz()">Verificar</button>
    <button onclick="closeQuiz()" style="background:#555;color:#ccc">Cerrar</button>
  </div>
  <div id="quiz-feedback"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/renderers/CSS2DRenderer.js"></script>
<script>
// ─── STATE ───
const state = {
  autoRotate: true,
  crossSection: false,
  labelsVisible: false,
  lightPhase: false,
  calvinCycle: false,
  structures: {},
  quizTarget: null
};

const structureInfo = {
  outerMembrane: {
    name: 'Membrana externa',
    desc: 'Membrana lipídica lisa y permeable que delimita al cloroplasto. Permite el paso de moléculas pequeñas e iones. Contiene porinas que facilitan el transporte de metabolitos.',
    tag: 'Estructura envolvente'
  },
  innerMembrane: {
    name: 'Membrana interna',
    desc: 'Membrana selectivamente permeable que regula el transporte de sustancias hacia el estroma. Contiene transportadores específicos para fosfatos, dicarboxilatos y ATP.',
    tag: 'Barrera selectiva'
  },
  intermembrane: {
    name: 'Espacio intermembrana',
    desc: 'Compartimento estrecho entre ambas membranas. Composición similar al citosol. Participa en el transporte de proteínas importadas al cloroplasto.',
    tag: 'Compartimento'
  },
  stroma: {
    name: 'Estroma',
    desc: 'Matriz acuosa interna del cloroplasto. Contiene las enzimas del Ciclo de Calvin (fijación de CO₂), ADN circular, ribosomas 70S y gránulos de almidón. Aquí ocurre la fase oscura de la fotosíntesis.',
    tag: 'Fase oscura'
  },
  thylakoids: {
    name: 'Tilacoides / Grana',
    desc: 'Sistema de membranas internas apiladas en discos (grana). Contienen los fotosistemas I y II, la cadena transportadora de electrones y la ATP sintasa. Aquí ocurre la fase luminosa de la fotosíntesis.',
    tag: 'Fase luminosa'
  },
  lumen: {
    name: 'Lumen tilacoidal',
    desc: 'Espacio interno del tilacoide donde se acumulan protones (H⁺) durante la fase luminosa, generando el gradiente electroquímico necesario para la síntesis de ATP por quimiósmosis.',
    tag: 'Gradiente de H⁺'
  },
  lamellae: {
    name: 'Lamelas del estroma',
    desc: 'Extensiones membranosas que conectan los grana entre sí, permitiendo la comunicación y el transporte de componentes entre las pilas de tilacoides.',
    tag: 'Conexión entre grana'
  },
  dna: {
    name: 'ADN circular',
    desc: 'Molécula de ADN circular de doble cadena propia del cloroplasto. Codifica algunas proteínas de los fotosistemas, ARN ribosomal y ARN de transferencia. Evidencia del origen endosimbiótico.',
    tag: 'Genoma propio'
  },
  ribosomes: {
    name: 'Ribosomas 70S',
    desc: 'Ribosomas de tipo procarionte (70S) que sintetizan proteínas codificadas por el ADN del cloroplasto. Similares a los ribosomas bacterianos, apoyan la teoría endosimbiótica.',
    tag: 'Síntesis proteica'
  },
  plastoglobuli: {
    name: 'Plastoglóbulos',
    desc: 'Gotas lipídicas esféricas que almacenan lípidos, plastoquinona, tocoferol (vitamina E) y carotenoides. Participan en el metabolismo lipídico y la respuesta al estrés.',
    tag: 'Reserva lipídica'
  },
  starchGranules: {
    name: 'Gránulos de almidón',
    desc: 'Depósitos temporales de almidón producido durante la fotosíntesis activa. Se forman cuando la tasa de fijación de CO₂ excede la exportación de triosas fosfato al citosol.',
    tag: 'Reserva energética'
  }
};

// ─── THREE.JS SETUP ───
let scene, camera, renderer, controls, labelRenderer;
let clippingPlane;
let groups = {};
let particles = { light: [], calvin: [] };
let labels = [];
const clock = new THREE.Clock();

function init() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0a0f1a);

  const w = window.innerWidth, h = window.innerHeight;
  camera = new THREE.PerspectiveCamera(45, w / h, 0.1, 1000);
  camera.position.set(8, 5, 10);

  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(w, h);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.localClippingEnabled = true;
  document.getElementById('canvas-container').appendChild(renderer.domElement);

  // CSS2D label renderer
  labelRenderer = new THREE.CSS2DRenderer();
  labelRenderer.setSize(w, h);
  labelRenderer.domElement.style.position = 'absolute';
  labelRenderer.domElement.style.top = '0';
  labelRenderer.domElement.style.pointerEvents = 'none';
  document.getElementById('canvas-container').appendChild(labelRenderer.domElement);

  // Clipping plane for cross-section
  clippingPlane = new THREE.Plane(new THREE.Vector3(-1, 0, 0), 0);

  // Controls
  controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.05;
  controls.autoRotate = true;
  controls.autoRotateSpeed = 0.8;
  controls.minDistance = 4;
  controls.maxDistance = 25;

  // Lights
  const ambient = new THREE.AmbientLight(0x404050, 0.6);
  scene.add(ambient);

  const dir = new THREE.DirectionalLight(0xfff5e0, 1.0);
  dir.position.set(8, 12, 8);
  dir.castShadow = true;
  scene.add(dir);

  const dir2 = new THREE.DirectionalLight(0x80a0ff, 0.3);
  dir2.position.set(-6, -4, -6);
  scene.add(dir2);

  const hemi = new THREE.HemisphereLight(0x88cc88, 0x224422, 0.4);
  scene.add(hemi);

  buildChloroplast();
  buildLabels();

  // Raycaster for clicks
  const raycaster = new THREE.Raycaster();
  const mouse = new THREE.Vector2();
  renderer.domElement.addEventListener('click', (e) => {
    mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
    mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
    raycaster.setFromCamera(mouse, camera);
    const all = [];
    Object.values(groups).forEach(g => { if (g.visible) g.traverse(c => { if (c.isMesh) all.push(c); }); });
    const hits = raycaster.intersectObjects(all);
    if (hits.length > 0) {
      let obj = hits[0].object;
      while (obj.parent && !obj.userData.structureKey) obj = obj.parent;
      if (obj.userData.structureKey) showInfo(obj.userData.structureKey);
    }
  });

  window.addEventListener('resize', onResize);
  document.getElementById('loading').style.display = 'none';
  animate();
}

function onResize() {
  const w = window.innerWidth, h = window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
  labelRenderer.setSize(w, h);
}

// ─── BUILD CHLOROPLAST ───
function buildChloroplast() {
  const ellipsoidGeometry = (rx, ry, rz, ws, hs) => {
    const g = new THREE.SphereGeometry(1, ws || 64, hs || 32);
    g.scale(rx, ry, rz);
    return g;
  };

  // Outer membrane
  const outerG = groups.outerMembrane = new THREE.Group();
  outerG.userData.structureKey = 'outerMembrane';
  const outerMesh = new THREE.Mesh(
    ellipsoidGeometry(4.5, 2.2, 2.8, 64, 32),
    new THREE.MeshPhysicalMaterial({
      color: 0x4a8a4a, transparent: true, opacity: 0.25,
      roughness: 0.3, metalness: 0.05, side: THREE.DoubleSide,
      clearcoat: 0.4, transmission: 0.3
    })
  );
  outerG.add(outerMesh);
  scene.add(outerG);

  // Inner membrane
  const innerG = groups.innerMembrane = new THREE.Group();
  innerG.userData.structureKey = 'innerMembrane';
  const innerMesh = new THREE.Mesh(
    ellipsoidGeometry(4.2, 2.0, 2.6, 64, 32),
    new THREE.MeshPhysicalMaterial({
      color: 0x3a7a3a, transparent: true, opacity: 0.2,
      roughness: 0.3, side: THREE.DoubleSide, clearcoat: 0.3, transmission: 0.4
    })
  );
  innerG.add(innerMesh);
  scene.add(innerG);

  // Intermembrane space (thin shell between outer and inner)
  const interG = groups.intermembrane = new THREE.Group();
  interG.userData.structureKey = 'intermembrane';
  const interMesh = new THREE.Mesh(
    ellipsoidGeometry(4.35, 2.1, 2.7, 48, 24),
    new THREE.MeshPhysicalMaterial({
      color: 0x5aaa6a, transparent: true, opacity: 0.08,
      roughness: 0.5, side: THREE.DoubleSide
    })
  );
  interG.add(interMesh);
  scene.add(interG);

  // Stroma (fill)
  const stromaG = groups.stroma = new THREE.Group();
  stromaG.userData.structureKey = 'stroma';
  const stromaMesh = new THREE.Mesh(
    ellipsoidGeometry(4.0, 1.85, 2.4, 48, 24),
    new THREE.MeshPhysicalMaterial({
      color: 0x2a5a3a, transparent: true, opacity: 0.12,
      roughness: 0.8, side: THREE.DoubleSide
    })
  );
  stromaG.add(stromaMesh);
  scene.add(stromaG);

  // Grana (stacks of thylakoids)
  const thyG = groups.thylakoids = new THREE.Group();
  thyG.userData.structureKey = 'thylakoids';
  const granaPositions = [
    [-1.5, 0, 0], [0, 0.2, 0.8], [1.5, -0.1, -0.3],
    [-0.5, 0.1, -1.0], [1.0, 0, 1.0], [-2.2, 0, 0.5],
    [2.2, 0.1, -0.6]
  ];
  granaPositions.forEach(pos => {
    const stackCount = 4 + Math.floor(Math.random() * 4);
    for (let i = 0; i < stackCount; i++) {
      const disk = new THREE.Mesh(
        new THREE.CylinderGeometry(0.45, 0.45, 0.08, 32),
        new THREE.MeshPhysicalMaterial({
          color: 0x3a9a5a, roughness: 0.4, metalness: 0.1,
          clearcoat: 0.2
        })
      );
      disk.position.set(pos[0], pos[1] - 0.3 + i * 0.1, pos[2]);
      disk.castShadow = true;
      thyG.add(disk);
    }
  });
  scene.add(thyG);

  // Lumen (inside thylakoids - shown as slightly smaller glowing disks)
  const lumenG = groups.lumen = new THREE.Group();
  lumenG.userData.structureKey = 'lumen';
  granaPositions.forEach(pos => {
    const stackCount = 4 + Math.floor(Math.random() * 4);
    for (let i = 0; i < stackCount; i++) {
      const inner = new THREE.Mesh(
        new THREE.CylinderGeometry(0.38, 0.38, 0.04, 32),
        new THREE.MeshPhysicalMaterial({
          color: 0x60c080, emissive: 0x204030, emissiveIntensity: 0.3,
          roughness: 0.6, transparent: true, opacity: 0.6
        })
      );
      inner.position.set(pos[0], pos[1] - 0.3 + i * 0.1, pos[2]);
      lumenG.add(inner);
    }
  });
  scene.add(lumenG);

  // Lamellae (connections between grana)
  const lamG = groups.lamellae = new THREE.Group();
  lamG.userData.structureKey = 'lamellae';
  for (let i = 0; i < granaPositions.length - 1; i++) {
    const a = new THREE.Vector3(...granaPositions[i]);
    const b = new THREE.Vector3(...granaPositions[i + 1]);
    const mid = a.clone().add(b).multiplyScalar(0.5);
    const dir = b.clone().sub(a);
    const len = dir.length();
    const tube = new THREE.Mesh(
      new THREE.CylinderGeometry(0.04, 0.04, len, 12),
      new THREE.MeshPhysicalMaterial({ color: 0x50b070, roughness: 0.5 })
    );
    tube.position.copy(mid);
    tube.lookAt(b);
    tube.rotateX(Math.PI / 2);
    lamG.add(tube);
  }
  scene.add(lamG);

  // DNA circular
  const dnaG = groups.dna = new THREE.Group();
  dnaG.userData.structureKey = 'dna';
  const dnaPath = new THREE.CurvePath();
  const dnaCircle = new THREE.EllipseCurve(0, 0, 0.6, 0.4, 0, Math.PI * 2, false, 0);
  const dnaPoints = dnaCircle.getPoints(64);
  const dnaShape = new THREE.BufferGeometry().setFromPoints(dnaPoints.map(p => new THREE.Vector3(p.x, 0, p.y)));
  const dnaTube = new THREE.TubeGeometry(
    new THREE.CatmullRomCurve3(dnaPoints.map(p => new THREE.Vector3(p.x, 0, p.y)), true),
    64, 0.03, 8, true
  );
  const dnaMesh = new THREE.Mesh(dnaTube, new THREE.MeshPhysicalMaterial({
    color: 0xf06060, emissive: 0x401010, emissiveIntensity: 0.4, roughness: 0.3
  }));
  dnaMesh.position.set(-2.5, -0.5, 1.2);
  dnaG.add(dnaMesh);
  // Second strand
  const dna2 = dnaMesh.clone();
  dna2.rotation.x = 0.3;
  dna2.position.set(-2.5, -0.3, 1.2);
  dnaG.add(dna2);
  scene.add(dnaG);

  // Ribosomes 70S
  const ribG = groups.ribosomes = new THREE.Group();
  ribG.userData.structureKey = 'ribosomes';
  const ribPositions = [
    [-2.8, 0.3, 0.5], [-1.8, -0.8, 1.5], [0.5, -0.9, 1.8],
    [2.0, 0.5, -1.5], [-0.8, 0.7, -1.6], [1.5, -0.7, 1.3],
    [-3.0, -0.4, -0.8], [2.8, 0.2, 0.5], [0.3, 0.8, -0.5],
    [-1.0, -0.6, -1.8], [1.8, -0.3, -1.2], [-2.0, 0.5, -1.0]
  ];
  ribPositions.forEach(p => {
    const large = new THREE.Mesh(
      new THREE.SphereGeometry(0.08, 16, 12),
      new THREE.MeshPhysicalMaterial({ color: 0xd0a040, roughness: 0.5 })
    );
    large.position.set(p[0], p[1], p[2]);
    ribG.add(large);
    const small = new THREE.Mesh(
      new THREE.SphereGeometry(0.06, 16, 12),
      new THREE.MeshPhysicalMaterial({ color: 0xe0b850, roughness: 0.5 })
    );
    small.position.set(p[0] + 0.07, p[1] + 0.06, p[2]);
    ribG.add(small);
  });
  scene.add(ribG);

  // Plastoglobuli
  const pgG = groups.plastoglobuli = new THREE.Group();
  pgG.userData.structureKey = 'plastoglobuli';
  const pgPos = [
    [0.8, 0.6, 1.5], [-1.2, 0.5, -1.3], [2.5, -0.4, 0.8],
    [-0.3, -0.7, 1.6], [1.8, 0.7, -0.8]
  ];
  pgPos.forEach(p => {
    const pg = new THREE.Mesh(
      new THREE.SphereGeometry(0.12 + Math.random() * 0.06, 20, 16),
      new THREE.MeshPhysicalMaterial({
        color: 0xe0c040, roughness: 0.2, metalness: 0.3, clearcoat: 0.6
      })
    );
    pg.position.set(...p);
    pgG.add(pg);
  });
  scene.add(pgG);

  // Starch granules
  const sgG = groups.starchGranules = new THREE.Group();
  sgG.userData.structureKey = 'starchGranules';
  const sgPos = [
    [2.8, 0, -1.5], [-2.6, -0.3, -0.5], [0, -0.5, -1.8], [3.0, 0.3, 0.3]
  ];
  sgPos.forEach(p => {
    const sg = new THREE.Mesh(
      new THREE.SphereGeometry(0.18 + Math.random() * 0.08, 16, 12),
      new THREE.MeshPhysicalMaterial({
        color: 0xe0e0c0, roughness: 0.7, metalness: 0.0, opacity: 0.85, transparent: true
      })
    );
    sg.position.set(...p);
    sgG.add(sg);
  });
  scene.add(sgG);

  // Create particle systems for animations
  buildLightPhaseParticles();
  buildCalvinParticles();
}

function buildLightPhaseParticles() {
  const count = 80;
  for (let i = 0; i < count; i++) {
    const p = new THREE.Mesh(
      new THREE.SphereGeometry(0.03, 8, 6),
      new THREE.MeshBasicMaterial({
        color: i < count / 2 ? 0xffff60 : 0x60a0ff,
        transparent: true, opacity: 0
      })
    );
    const granaIdx = Math.floor(Math.random() * 7);
    const granaPos = [[-1.5,0,0],[0,0.2,0.8],[1.5,-0.1,-0.3],[-0.5,0.1,-1.0],[1.0,0,1.0],[-2.2,0,0.5],[2.2,0.1,-0.6]];
    p.userData.center = new THREE.Vector3(...granaPos[granaIdx]);
    p.userData.angle = Math.random() * Math.PI * 2;
    p.userData.radius = 0.3 + Math.random() * 0.3;
    p.userData.speed = 1.5 + Math.random() * 2;
    p.userData.yOff = (Math.random() - 0.5) * 0.4;
    scene.add(p);
    particles.light.push(p);
  }
}

function buildCalvinParticles() {
  const count = 50;
  for (let i = 0; i < count; i++) {
    const color = i < 20 ? 0xff8080 : (i < 35 ? 0x80ff80 : 0x8080ff);
    const p = new THREE.Mesh(
      new THREE.SphereGeometry(0.04, 8, 6),
      new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0 })
    );
    p.userData.angle = Math.random() * Math.PI * 2;
    p.userData.radius = 1.5 + Math.random() * 1.5;
    p.userData.speed = 0.4 + Math.random() * 0.6;
    p.userData.yOff = (Math.random() - 0.5) * 1.0;
    scene.add(p);
    particles.calvin.push(p);
  }
}

// ─── LABELS ───
function buildLabels() {
  const labelData = [
    { key: 'outerMembrane', pos: [0, 2.5, 2.8], text: 'Membrana externa' },
    { key: 'innerMembrane', pos: [0, 2.2, 2.5], text: 'Membrana interna' },
    { key: 'stroma', pos: [2.5, 1.5, 0], text: 'Estroma' },
    { key: 'thylakoids', pos: [0, 1.2, 0.8], text: 'Grana (tilacoides)' },
    { key: 'lumen', pos: [0, 0.6, 0.8], text: 'Lumen tilacoidal' },
    { key: 'lamellae', pos: [0.75, 0.3, 0.4], text: 'Lamelas' },
    { key: 'dna', pos: [-2.5, 0.2, 1.2], text: 'ADN circular' },
    { key: 'ribosomes', pos: [-2.8, 0.8, 0.5], text: 'Ribosomas 70S' },
    { key: 'plastoglobuli', pos: [0.8, 1.1, 1.5], text: 'Plastoglóbulos' },
    { key: 'starchGranules', pos: [2.8, 0.7, -1.5], text: 'Gránulos almidón' }
  ];

  labelData.forEach(ld => {
    const div = document.createElement('div');
    div.style.cssText = 'background:rgba(0,0,0,.7);color:#8fc98a;padding:2px 8px;border-radius:4px;font-size:11px;font-family:system-ui;white-space:nowrap;border:1px solid rgba(143,201,138,.3)';
    div.textContent = ld.text;
    const label = new THREE.CSS2DObject(div);
    label.position.set(...ld.pos);
    label.visible = false;
    label.userData.key = ld.key;
    scene.add(label);
    labels.push(label);
  });
}

// ─── CONTROLS ───
function toggleAutoRotate() {
  state.autoRotate = !state.autoRotate;
  controls.autoRotate = state.autoRotate;
  document.getElementById('btn-autorotate').textContent = `⟳ Auto-rotación: ${state.autoRotate ? 'ON' : 'OFF'}`;
  document.getElementById('btn-autorotate').classList.toggle('active', state.autoRotate);
}

function toggleCrossSection() {
  state.crossSection = !state.crossSection;
  document.getElementById('btn-crosssection').classList.toggle('active', state.crossSection);
  Object.values(groups).forEach(g => {
    g.traverse(child => {
      if (child.isMesh && child.material) {
        const mats = Array.isArray(child.material) ? child.material : [child.material];
        mats.forEach(m => {
          m.clippingPlanes = state.crossSection ? [clippingPlane] : [];
          m.clipShadows = true;
          m.needsUpdate = true;
        });
      }
    });
  });
}

function toggleLabels() {
  state.labelsVisible = !state.labelsVisible;
  document.getElementById('btn-labels').textContent = `🏷 Etiquetas: ${state.labelsVisible ? 'ON' : 'OFF'}`;
  document.getElementById('btn-labels').classList.toggle('active', state.labelsVisible);
  labels.forEach(l => { l.visible = state.labelsVisible && groups[l.userData.key] && groups[l.userData.key].visible; });
}

function resetView() {
  camera.position.set(8, 5, 10);
  controls.target.set(0, 0, 0);
  controls.update();
  if (state.crossSection) toggleCrossSection();
  if (state.lightPhase) toggleLightPhase();
  if (state.calvinCycle) toggleCalvin();
  Object.keys(groups).forEach(k => {
    groups[k].visible = true;
    const btn = document.querySelector(`[data-structure="${k}"]`);
    if (btn) btn.classList.remove('active');
  });
  if (state.labelsVisible) toggleLabels();
  closeInfo();
  closeQuiz();
}

function toggleStructure(btn) {
  const key = btn.dataset.structure;
  groups[key].visible = !groups[key].visible;
  btn.classList.toggle('active', !groups[key].visible);
  if (state.labelsVisible) {
    labels.forEach(l => { if (l.userData.key === key) l.visible = groups[key].visible; });
  }
}

function toggleLightPhase() {
  state.lightPhase = !state.lightPhase;
  document.getElementById('btn-lightphase').classList.toggle('active', state.lightPhase);
  particles.light.forEach(p => { p.material.opacity = state.lightPhase ? 0.8 : 0; });
}

function toggleCalvin() {
  state.calvinCycle = !state.calvinCycle;
  document.getElementById('btn-calvin').classList.toggle('active', state.calvinCycle);
  particles.calvin.forEach(p => { p.material.opacity = state.calvinCycle ? 0.7 : 0; });
}

function showInfo(key) {
  const info = structureInfo[key];
  if (!info) return;
  document.getElementById('info-title').textContent = info.name;
  document.getElementById('info-body').textContent = info.desc;
  document.getElementById('info-tag').textContent = info.tag;
  document.getElementById('info-panel').classList.add('visible');
}

function closeInfo() {
  document.getElementById('info-panel').classList.remove('visible');
}

// ─── QUIZ ───
const quizKeys = Object.keys(structureInfo);
function startQuiz() {
  const idx = Math.floor(Math.random() * quizKeys.length);
  state.quizTarget = quizKeys[idx];
  // Highlight structure
  Object.values(groups).forEach(g => {
    g.traverse(c => { if (c.isMesh && c.material && !Array.isArray(c.material)) {
      c.material._origEmissive = c.material.emissive ? c.material.emissive.getHex() : 0;
      c.material._origEmissiveI = c.material.emissiveIntensity || 0;
    }});
  });
  if (groups[state.quizTarget]) {
    groups[state.quizTarget].traverse(c => {
      if (c.isMesh && c.material) {
        c.material.emissive = new THREE.Color(0xffaa00);
        c.material.emissiveIntensity = 0.6;
      }
    });
  }
  document.getElementById('quiz-question').textContent = '¿Qué estructura está resaltada en naranja?';
  document.getElementById('quiz-input').value = '';
  document.getElementById('quiz-feedback').textContent = '';
  document.getElementById('quiz-overlay').classList.add('visible');
  document.getElementById('quiz-input').focus();
}

function checkQuiz() {
  const answer = document.getElementById('quiz-input').value.trim().toLowerCase();
  const correct = structureInfo[state.quizTarget].name.toLowerCase();
  const fb = document.getElementById('quiz-feedback');
  if (answer === correct || correct.includes(answer) && answer.length > 3) {
    fb.textContent = '✅ ¡Correcto! ' + structureInfo[state.quizTarget].name;
    fb.style.color = '#8fc98a';
    setTimeout(closeQuiz, 2000);
  } else {
    fb.textContent = '❌ Intenta de nuevo. Pista: ' + structureInfo[state.quizTarget].desc.substring(0, 60) + '…';
    fb.style.color = '#f08080';
  }
}

function closeQuiz() {
  document.getElementById('quiz-overlay').classList.remove('visible');
  if (state.quizTarget && groups[state.quizTarget]) {
    groups[state.quizTarget].traverse(c => {
      if (c.isMesh && c.material) {
        c.material.emissive = new THREE.Color(c.material._origEmissive || 0);
        c.material.emissiveIntensity = c.material._origEmissiveI || 0;
      }
    });
  }
  state.quizTarget = null;
}

// ─── ANIMATION LOOP ───
function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  controls.update();

  // Light phase particles
  if (state.lightPhase) {
    particles.light.forEach(p => {
      p.userData.angle += p.userData.speed * 0.016;
      p.position.x = p.userData.center.x + Math.cos(p.userData.angle) * p.userData.radius;
      p.position.z = p.userData.center.z + Math.sin(p.userData.angle) * p.userData.radius;
      p.position.y = p.userData.center.y + p.userData.yOff + Math.sin(t * 3 + p.userData.angle) * 0.05;
    });
  }

  // Calvin cycle particles
  if (state.calvinCycle) {
    particles.calvin.forEach(p => {
      p.userData.angle += p.userData.speed * 0.016;
      p.position.x = Math.cos(p.userData.angle) * p.userData.radius;
      p.position.z = Math.sin(p.userData.angle) * p.userData.radius;
      p.position.y = p.userData.yOff + Math.sin(t * 0.8 + p.userData.angle) * 0.3;
    });
  }

  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}

// ─── INIT ───
init();
</script>
</body>
</html>
